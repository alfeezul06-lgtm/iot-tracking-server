<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Automotive Spare Parts Warehouse System
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">


<header>


<div class="brand">


<div class="logo">
🚗
</div>


<div>

<h1>
AUTOMOTIVE SPARE PARTS TRACKING SYSTEM
</h1>

<p>
RFID + IoT Warehouse Inventory Management
</p>


</div>


</div>




<div class="server">

<span></span>

SERVER ONLINE


<div id="live-time">
--:--
</div>


</div>


</header>






<section class="metrics">


<div class="card">

<h3>TOTAL PARTS</h3>

<h1 id="total-products">
0
</h1>

</div>



<div class="card">

<h3>TOTAL STOCK</h3>

<h1 id="total-units">
0
</h1>

</div>



<div class="card danger">

<h3>LOW STOCK</h3>

<h1 id="low-stock">
0
</h1>

</div>



<div class="card money">

<h3>INVENTORY VALUE</h3>

<h1 id="inv-value">
RM0
</h1>

</div>


</section>







<div class="control">


<input 
id="search-bar"
placeholder="Search Part No / Item / Vehicle..."
>


<button onclick="openModal()">

+ RFID SCAN

</button>


</div>







<div class="table-box">


<table>


<thead>

<tr>

<th>PART NO</th>

<th>ITEM</th>

<th>BRAND</th>

<th>VEHICLE</th>

<th>RACK</th>

<th>QTY</th>

<th>STATUS</th>

<th>PRICE</th>


</tr>


</thead>



<tbody id="stock-tbody">


</tbody>



</table>


</div>









<section class="bottom">


<div class="panel">


<h2>
Transaction History
</h2>


<button onclick="clearLogs()">
CLEAR
</button>



<div id="logs">

</div>



</div>







<div class="panel">


<h2>
Rack Capacity
</h2>



<div id="chart-box">

</div>



</div>



</section>




</div>









<!-- RFID MODAL -->


<div id="modal">


<div class="modal-box">


<h2>
SPARE PART RFID TRANSACTION
</h2>



<label>
RFID UID
</label>

<input id="uid">





<label>
Part Number
</label>

<input id="partNumber">





<label>
Item Name
</label>

<input id="name">





<label>
Brand
</label>

<input id="brand">





<label>
Vehicle Model
</label>

<input id="vehicle">





<label>
Category
</label>


<select id="category">


<option>
Engine
</option>


<option>
Brake System
</option>


<option>
Electrical
</option>


<option>
Cooling System
</option>


<option>
Suspension
</option>


<option>
Transmission
</option>


</select>







<label>
Rack Location
</label>


<select id="rack">


<option>
Rack-A01
</option>


<option>
Rack-A02
</option>


<option>
Rack-B01
</option>


<option>
Rack-B02
</option>


<option>
Rack-C01
</option>


</select>







<label>
Minimum Stock
</label>


<input 
type="number"
id="minStock"
value="5"
>







<label>
MODE
</label>


<select id="mode">


<option value="STOCK_IN">

STOCK IN

</option>


<option value="STOCK_OUT">

STOCK OUT

</option>


</select>







<label>
Quantity
</label>


<input

type="number"

id="qty"

value="1"

>






<label>
Price
</label>


<input

id="price"

value="RM0"

>







<button onclick="sendScan()">

SUBMIT

</button>


<button onclick="closeModal()">

CANCEL

</button>




</div>


</div>





<script src="script.js"></script>


</body>

</html>
