<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
IoT Warehouse Tracking System
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">


<!-- HEADER -->

<header class="header">


<div class="brand">

<div class="logo">
📦
</div>


<div>

<h2>
WAREHOUSE TRACKING SYSTEM
</h2>

<p>
RFID + IoT Inventory Monitoring
</p>

</div>


</div>



<div class="network">


<span class="online-dot"></span>

SERVER ONLINE


<div id="live-time">
--:--:--
</div>


</div>


</header>






<!-- METRIC -->


<section class="metrics">


<div class="card">

<h4>
PRODUCTS
</h4>

<h1 id="total-products">
0
</h1>

</div>



<div class="card">

<h4>
TOTAL UNITS
</h4>

<h1 id="total-units">
0
</h1>

</div>




<div class="card danger">

<h4>
LOW STOCK
</h4>

<h1 id="low-stock">
0
</h1>

</div>




<div class="card money">

<h4>
VALUE
</h4>

<h1 id="inv-value">
RM 0
</h1>

</div>


</section>







<!-- CONTROL -->


<div class="control">


<input
id="search-bar"
placeholder="Search item / RFID..."
>


<button onclick="openScanModal()">
+ RFID SIMULATION
</button>


</div>







<!-- TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>
UID
</th>

<th>
ITEM
</th>


<th>
ZONE
</th>


<th>
QTY
</th>


<th>
STATUS
</th>


<th>
PRICE
</th>


<th>
ACTION
</th>


</tr>


</thead>



<tbody id="stock-tbody">


</tbody>



</table>



</div>








<!-- LOWER -->


<div class="bottom">


<div class="panel">


<h3>
Transaction History
</h3>


<button onclick="clearLogs()">
Clear
</button>



<div id="transactions-list">

</div>



</div>






<div class="panel">


<h3>
Zone Capacity
</h3>


<div id="chart-box">

</div>



</div>



</div>





</div>









<!-- MODAL -->


<div id="scan-modal">


<div class="modal">


<h2>
RFID TRANSACTION
</h2>


<label>
UID
</label>

<input id="scan-uid">



<label>
NAME
</label>

<input id="scan-name">



<label>
ZONE
</label>


<select id="scan-rack">

<option>
Zone-A
</option>

<option>
Zone-B
</option>

<option>
Zone-C
</option>

<option>
Zone-D
</option>

<option>
Zone-E
</option>


</select>



<label>
MODE
</label>


<select id="scan-status">

<option value="IN">
STOCK IN
</option>


<option value="OUT">
STOCK OUT
</option>


</select>



<label>
QUANTITY
</label>


<input
type="number"
id="scan-qty"
value="1"
>




<label>
PRICE
</label>


<input
id="scan-price"
value="RM 10"
>




<div class="buttons">


<button onclick="closeScanModal()">
Cancel
</button>


<button onclick="submitScanPayload()">
Submit
</button>


</div>



</div>


</div>







<script src="script.js"></script>


</body>

</html>
