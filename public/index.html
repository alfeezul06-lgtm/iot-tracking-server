<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IoT Tracking Dashboard</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff}header{background:#1e293b;padding:18px;text-align:center;font-size:26px;font-weight:bold}.container{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.box,.card{background:#1e293b;border-radius:12px;padding:15px}.box{text-align:center}.box h2{margin:8px 0}.card{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.status-in{color:#22c55e;font-weight:bold}.status-out{color:#ef4444;font-weight:bold}button{background:#ef4444;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer}small{color:#cbd5e1}</style></head><body><header>📦 IoT Tracking Dashboard</header><div class="container"><div class="grid"><div class="box"><div>Total</div><h2 id="total">0</h2></div><div class="box"><div>IN</div><h2 id="in">0</h2></div><div class="box"><div>OUT</div><h2 id="out">0</h2></div></div><h2>Current Items</h2><div id="items"></div><h2>History</h2><div id="history"></div></div><script>
const API="";
async function load(){try{const r=await fetch(API+"/data");const d=await r.json();const items=document.getElementById("items"),hist=document.getElementById("history");items.innerHTML="";hist.innerHTML="";let t=0,i=0,o=0;for(const name in d.items){t++;const s=d.items[name];if(s==="IN")i++;else o++;items.innerHTML+=`<div class="card"><div><b>${name}</b><br><span class="status-${s.toLowerCase()}">${s}</span></div><button onclick="removeItem('${name}')">Remove</button></div>`;}total.innerText=t;document.getElementById("in").innerText=i;document.getElementById("out").innerText=o;(d.history||[]).forEach(h=>{hist.innerHTML+=`<div class="card"><div><b>${h.name}</b><br><span class="status-${h.status.toLowerCase()}">${h.status}</span><br><small>${h.time}</small></div></div>`;});}catch(e){console.log(e);}}
async function removeItem(name){await fetch("/remove/"+encodeURIComponent(name),{method:"DELETE"});load();}
setInterval(load,1000);load();
</script></body></html>
