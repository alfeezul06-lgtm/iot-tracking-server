<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
IoT Warehouse Tracking System
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="dashboard">


<header>


<div class="brand">

<div class="logo">
📦
</div>

<div>

<h1>
WAREHOUSE TRACKING SYSTEM
</h1>

<p>
RFID + IoT Inventory Monitoring
</p>

</div>


</div>



<div class="server">

<span></span>

SERVER ONLINE

<div id="live-time">
--:--
</div>

</div>


</header>





<section class="metrics">


<div class="card">

<h3>PRODUCTS</h3>

<h1 id="total-products">
0
</h1>

</div>


<div class="card">

<h3>TOTAL UNITS</h3>

<h1 id="total-units">
0
</h1>

</div>



<div class="card danger">

<h3>LOW STOCK</h3>

<h1 id="low-stock">
0
</h1>

</div>



<div class="card money">

<h3>VALUE</h3>

<h1 id="inv-value">
RM0
</h1>

</div>



</section>





<div class="control">


<input 
id="search-bar"
placeholder="Search UID / Item..."
>


<button onclick="openModal()">
+ RFID SCAN
</button>


</div>





<div class="table-box">


<table>


<thead>

<tr>

<th>PART NO</th>
<th>ITEM</th>
<th>VEHILCE</th>
<th>ZONE</th>
<th>QTY</th>
<th>STATUS</th>
<th>PRICE</th>

</tr>

</thead>



<tbody id="stock-tbody">

</tbody>



</table>


</div>






<section class="bottom">


<div class="panel">


<h2>
Transaction History
</h2>


<button onclick="clearLogs()">
CLEAR
</button>


<div id="logs">

</div>


</div>





<div class="panel">


<h2>
Zone Capacity
</h2>


<div id="chart-box">

</div>


</div>



</section>



</div>







<!-- RFID MODAL -->


<div id="modal">


<div class="modal-box">


<h2>
RFID TRANSACTION
</h2>


<label>
UID
</label>

<input id="uid">


<label>
ITEM NAME
</label>

<input id="name">



<label>
ZONE
</label>

<select id="zone">

<option>
Rack-A01
</option>

<option>
Rack-A02
</option>

<option>
Rack-A03
</option>

<option>
Rack-A04
</option>

<option>
Rack-A05
</option>

</select>



<label>
MODE
</label>


<select id="mode">

<option value="STOCK_IN">
STOCK IN
</option>


<option value="STOCK_OUT">
STOCK OUT
</option>


</select>



<label>
QUANTITY
</label>


<input 
type="number"
id="qty"
value="1"
>



<button onclick="sendScan()">
SUBMIT
</button>


<button onclick="closeModal()">
CANCEL
</button>



</div>

</div>



<script src="script.js"></script>


</body>

</html>
