<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="fa-solid fa-chart-pie"></i> <span>CoreDash</span>
            </div>
            <ul class="sidebar-menu">
                <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="#"><i class="fa-solid fa-wallet"></i> Wallet</a></li>
                <li><a href="#"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <h2>Overview Dashboard</h2>
                <div class="user-profile">
                    <i class="fa-solid fa-bell notification-icon"></i>
                    <div class="avatar">JD</div>
                </div>
            </header>

            <section class="metrics-grid">
                <div class="card">
                    <div class="card-icon blue"><i class="fa-solid fa-dollar-sign"></i></div>
                    <div class="card-info">
                        <h3>$45,231</h3>
                        <p>Total Revenue</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon green"><i class="fa-solid fa-users"></i></div>
                    <div class="card-info">
                        <h3>2,845</h3>
                        <p>Active Users</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon orange"><i class="fa-solid fa-shopping-bag"></i></div>
                    <div class="card-info">
                        <h3>1,205</h3>
                        <p>Total Sales</p>
                    </div>
                </div>
            </section>

            <section class="charts-grid">
                <div class="chart-container">
                    <h3>Monthly Sales Performance</h3>
                    <canvas id="salesChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Traffic Sources</h3>
                    <canvas id="pieChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Line Chart Config
        const ctx1 = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Revenue ($)',
                    data: [12000, 19000, 3000, 5000, 22000, 31000],
                    borderColor: '#4361ee',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(67, 97, 238, 0.1)'
                }]
            }
        });

        // Pie Chart Config
        const ctx2 = document.getElementById('pieChart').getContext('2d');
        new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['Direct', 'Social', 'Referral'],
                datasets: [{
                    data: [55, 30, 15],
                    backgroundColor: ['#4361ee', '#2ec4b6', '#ff9f1c']
                }]
            }
        });
    </script>
</body>
</html>
