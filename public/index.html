<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Warehouse Dashboard</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0}
header{background:#1e293b;padding:18px;text-align:center;font-size:28px}
.wrap{padding:20px;max-width:1200px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#1e293b;padding:15px;border-radius:10px;text-align:center}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #334155}
button{padding:6px 12px}
input{padding:8px;width:250px}
</style></head>
<body>
<header>📦 Warehouse Stock Management Dashboard</header>
<div class="wrap">
<div class="cards">
<div class="card"><h3>Total Products</h3><h2 id="products">0</h2></div>
<div class="card"><h3>Total Stock</h3><h2 id="stock">0</h2></div>
<div class="card"><h3>Low Stock</h3><h2 id="low">0</h2></div>
<div class="card"><h3>Inventory Value</h3><h2 id="value">RM0</h2></div>
</div>
<h2>Warehouse Inventory</h2>
<input id="search" placeholder="Search item..." onkeyup="render()">
<table>
<thead><tr><th>Item</th><th>RFID</th><th>Qty</th><th>Unit(RM)</th><th>Total</th><th>Status</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<h2>Recent Activity</h2>
<ul id="history"></ul>
</div>
<script>
let items=[
{name:"Motor",uid:"TAG001",qty:20,price:120},
{name:"Sensor",uid:"TAG002",qty:5,price:25},
{name:"Screw",uid:"TAG003",qty:200,price:0.2}
];
let history=["Motor +5","Sensor -2","Screw +100"];
function render(){
let tb=document.getElementById("tbody");tb.innerHTML="";
let q=document.getElementById("search").value.toLowerCase();
let stock=0,low=0,val=0;
items.filter(i=>i.name.toLowerCase().includes(q)).forEach(i=>{
stock+=i.qty;val+=i.qty*i.price;if(i.qty<10)low++;
let st=i.qty==0?"Out":i.qty<10?"Low":"Normal";
tb.innerHTML+=`<tr><td>${i.name}</td><td>${i.uid}</td><td>${i.qty}</td><td>${i.price}</td><td>${(i.qty*i.price).toFixed(2)}</td><td>${st}</td></tr>`;
});
products.innerText=items.length;stockEl=document.getElementById("stock");stockEl.innerText=stock;
lowEl=document.getElementById("low");lowEl.innerText=low;
value.innerText="RM"+val.toFixed(2);
historyEl=document.getElementById("history");historyEl.innerHTML="";
history.forEach(h=>historyEl.innerHTML+=`<li>${h}</li>`);
}
render();
</script>
</body></html>
